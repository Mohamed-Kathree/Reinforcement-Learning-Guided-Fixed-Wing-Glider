# Provenance: measured | derived_cad | estimated | design_target
# `range` brackets BOTH the V19 build estimate and the CAD rebuild where they differ.
# Narrow a range only when the corresponding quantity has been measured.
#
# `dr_range` (optional) is the range domain randomisation actually samples,
# when it must be narrower than `range` for a reason other than measurement.
# It always comes with `dr_reason`, must lie inside `range`, and must still
# bracket both estimates. `range` keeps recording what is known.
#
# This file is the single source of truth for mass properties. After editing it,
# regenerate the aircraft file:   python aircraft/generate_fdm.py
# tests/test_mass_properties.py fails if aircraft/rlglider/rlglider.xml is stale.

mass:
  flying_kg:     {value: 1.64, range: [1.50, 1.80], source: estimated}
  fuselage_g:    {value: 240,  source: measured, date: 2026-11-07}
  tail_g:        {value: 200,  source: measured, date: 2026-11-07}
  wing_g:        {value: 587,  range: [520, 650], source: estimated}
  electronics_g: {value: 380,  range: [340, 420], source: estimated}
  ballast_g:     {value: 230,  range: [180, 280], source: estimated}

cg:
  target_x_mm: {value: 362, source: design_target}   # 30% MAC
  # residual_m is positive FORWARD of the 362 mm target (body frame).
  residual_m:  {value: 0.0, range: [-0.015, 0.015], source: estimated,
                dr_range: [-0.013, 0.015],
                dr_reason: "SPEC V20 Phase 5 gate sweep: with the CG 15 mm aft, weakest
                  cmalpha_mult (0.75) and steepest cl_mult (1.2) the airframe has a negative
                  static margin at the design trim alpha and fails the trimmed-stability gate
                  (elevator-trimmed mode). It passes with the CG at most 13.18 mm aft; the aft
                  limit is set to 13 mm. Forward limit unchanged. Not a measurement."}

inertia:
  ixx: {value: 0.21, range: [0.14, 0.32], source: derived_cad}  # V19 0.28, CAD 0.16
  iyy: {value: 0.16, range: [0.10, 0.26], source: derived_cad,   # V19 0.22, CAD 0.12
        dr_range: [0.110, 0.26],
        dr_reason: "SPEC V20 Phase 4: 0.33% of full-range samples were unreachable by the
          point-mass solver (heavy, |CG| >= 9 mm, Iyy <= 0.105). Moving the CG with ballast
          near the reference point always adds pitch inertia, and the inertia pairs can only
          add, so the lowest Iyy cannot be combined with a large CG shift. 0.110 removes
          every failure (4000 random samples, 343-point grid at the floor) and still
          brackets both estimates. Not a measurement."}
  # izz is NOT an entry. Modelling assumption: izz = ixx + iyy exactly.
  # A rigid body satisfies ixx + iyy >= izz, with equality for a flat plate
  # (all mass in the x-y plane), so this is the physical UPPER bound on yaw
  # inertia: the most sluggish yaw response, i.e. the conservative end.
  # Both estimates put the real ratio izz / (ixx + iyy) in 0.90-1.00
  # (CAD 0.28/0.28 = 1.00; V19 0.45/0.50 = 0.90). Only a mass offset in z can
  # lower it; see docs/SPEC_V20_decisions.md (known extension, unbuilt).
  #
  # ixz: the two estimates disagree in SIGN (CAD rebuild +0.0036, V19 -0.008).
  # Not pinned; the range brackets both and Phase 4 randomises it. The value is
  # the range midpoint, not a preference for either estimate.
  ixz: {value: 0.0, range: [-0.010, 0.010], source: estimated}

geometry:
  wing_area_m2: {value: 0.38, range: [0.361, 0.399], source: derived_cad}
  span_m:       {value: 2.0,  source: measured}
  chord_mean_m: {value: 0.19, source: derived_cad}
