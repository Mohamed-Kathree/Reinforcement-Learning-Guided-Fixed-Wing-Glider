<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Return-to-launch autonomy for a hand-launched fixed-wing glider: a reinforcement-learning policy with a deterministic fallback, and its validation." />
    <title>RL Glider</title>
    <script>
      // Apply the remembered appearance before first paint (App.tsx owns it after that).
      try {
        if (localStorage.getItem("rl-glider-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
