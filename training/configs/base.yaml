# training/configs/base.yaml
# ===========================
# Reference documentation for simulation, glider, reward, PPO, and curriculum
# parameters. NOT every section here is actually read by code -- see the
# per-section notes below. Where a section IS live-wired, treat it as the
# source of truth and do not hard-code those values elsewhere; where a
# section is marked reference-only, the real values live in the Python file
# named in that section's comment, and this file exists purely so a human
# can see the full parameter picture in one place.
#
# Live-wired sections (actually read by code):
#   reward:      -- training/train.py flat_env_cfg() / training/evaluate.py
#                   _build_eval_env() -> env/glider_env.py GliderEnv(cfg=...)
#                   (env/reward.py DEFAULT_REWARD_CFG is the fallback used
#                   when GliderEnv is constructed without an explicit cfg,
#                   e.g. in tests/scratch scripts)
#   launch.speed_min_ms / speed_max_ms / pitch_min_deg / pitch_max_deg
#                -- same flat_env_cfg()/_build_eval_env() path; per-episode
#                   randomisation range for the (unknown) real apex-hand-off
#                   energy state -- a fixed hardware uncertainty, not
#                   curriculum-stage-dependent (same range at every stage)
#   ppo:         -- training/train.py train()
#   eval:        -- training/train.py train() (EvalCallback), training/evaluate.py
#   curriculum:  -- training/train.py train() -> CurriculumScheduler
#
# Reference-only sections (code does NOT read these; kept for documentation --
# changing a value here has no effect until the referenced Python file is
# also updated):
#   sim:         -- module constants in env/glider_env.py (DT_PHYS, DT_RL,
#                   N_SUBSTEPS, MAX_STEPS). Not runtime-configurable: JSBSim
#                   caches dt at load_model() time (see sim/jsbsim_fdm.py),
#                   so changing dt_phys requires re-deriving several other
#                   constants together, not a safe single cfg override.
#   glider:      -- aircraft/rlglider/rlglider.xml (JSBSim owns mass, inertia,
#                   aerodynamics, actuator dynamics)
#   launch.alt0_m
#                -- this IS curriculum-stage-dependent; the real per-stage
#                   values live in env/curriculum.py STAGES, applied via
#                   env.set_stage(). The value here is just a Stage-0-ish
#                   nominal default for eyeballing.
#   domain_rand: -- per-stage aero_scale_range now lives in env/curriculum.py
#                   STAGES (superseding this flat section); cl_mult and
#                   ctrl_eff_mult ranges are hardcoded in
#                   env/glider_env.py::_sample_domain_rand(). mass_range /
#                   inertia_scale_range / servo_* are not used at all with
#                   JSBSim (mass/inertia/actuators are fixed in rlglider.xml).

# ---------------------------------------------------------------------------
# Simulation timing (REFERENCE ONLY -- see note above; real values are the
# DT_PHYS/DT_RL/N_SUBSTEPS/MAX_STEPS constants in env/glider_env.py)
# ---------------------------------------------------------------------------
sim:
  dt_phys:    0.005       # physics integration step (s)  -- 200 Hz
  dt_rl:      0.050       # RL policy step (s)            -- 20 Hz
  substeps:   10          # dt_rl / dt_phys; kept explicit for readability
  max_steps:  2000        # maximum policy steps per episode (~100 s of flight)
  rho:        1.225       # air density (kg/m^3), sea-level ISA

# ---------------------------------------------------------------------------
# Glider physical parameters (nominal; domain randomisation scales these)
# ---------------------------------------------------------------------------
glider:
  m:    1.1               # all-up mass (kg)
  S:    0.38              # wing area (m^2)
  b:    2.0               # wingspan (m)
  c:    0.19              # mean aerodynamic chord (m)  ~= S/b
  AR:   10.5              # aspect ratio               ~= b^2/S
  # Inertia tensor diagonal (kg*m^2, FRD body frame)
  Ixx:  0.18              # roll inertia
  Iyy:  0.10              # pitch inertia
  Izz:  0.26              # yaw inertia
  Ixz:  0.01              # roll-yaw cross term (small; symmetric glider)

# ---------------------------------------------------------------------------
# Launch conditions
# alt0_m reflects the as-built hardware: hand/ground-launched, not a tow
# release. Realistic peak altitude after the launch zoom-climb is ~15-25 m
# (see as-built electronics notes).
#
# speed_*_ms / pitch_*_deg are randomised PER EPISODE across this full range
# (not jittered around one nominal value) to cover the plausible energy
# states the not-yet-built ESP32 apex-detection firmware might hand control
# over at -- anywhere from a true apex (near-level, ~trim speed) to the
# original release-state assumption (nose-up, near launch speed). Same value
# at every curriculum stage on purpose: this is a fixed hardware uncertainty
# to be robust to, not something that should get easier/harder with
# curriculum progress the way wind/noise/R_home do.
# ---------------------------------------------------------------------------
launch:
  speed_min_ms:  8.0       # m/s -- LIVE (flat_env_cfg)
  speed_max_ms:  15.0      # m/s -- LIVE (flat_env_cfg)
  pitch_min_deg: 0.0       # deg, nose-up -- LIVE (flat_env_cfg)
  pitch_max_deg: 15.0      # deg, nose-up -- LIVE (flat_env_cfg)
  alt0_m:        22.0      # REFERENCE ONLY -- real per-stage values are env/curriculum.py STAGES

# ---------------------------------------------------------------------------
# Reward weights  (mirrors DEFAULT_REWARD_CFG in env/reward.py)
#
# Phase 4 precision-landing task (RLGlider_Phase4_Landing_Task_Spec.md):
# dist_home < R_home_m no longer terminates the episode -- only ground
# contact (touched_down) or a JSBSim fault does. R_home_m is now purely a
# precision-scoring parameter, overridden per curriculum stage alongside
# sigma_centre_m/sink_bad/roll_bad_deg (env/curriculum.py STAGES).
# w_progress/w_airtime/w_agl/agl_min are REMOVED (not zeroed): w_progress
# directly opposed the new "longest route" objective (replaced by the
# one-sided w_unreach reachability barrier), w_airtime rewarded loitering
# rather than route length (replaced by w_path), and w_agl/agl_min penalised
# being below the flare altitude, which is now a MANDATORY part of every
# successful landing (the open-loop flare shield that used to enforce it was
# also deleted -- see env/glider_env.py::_safety_shield).
# ---------------------------------------------------------------------------
reward:
  # Terminal landing grade (see env/reward.py's module docstring for the
  # full quality*(precision+bullseye) - (1-quality)*crash formula)
  w_land:       500.0     # centre-precision bonus, scaled by landing quality
  w_bullseye:   150.0     # narrow secondary precision bonus (also quality-scaled)
  w_crash:      200.0     # penalty on a bad landing / fault, scaled by (1 - quality)
  sigma_centre_m: 8.0     # Gaussian width for r_precision; overridden per curriculum stage

  # Landing-quality grading bands: OK = full credit, BAD = zero credit,
  # linear ramp between. Only sink_bad/roll_bad_deg widen per curriculum
  # stage (env/curriculum.py STAGES) -- the rest stay fixed so "clean
  # landing" never changes definition, only how strictly it's enforced.
  sink_ok:       0.8      # m/s; measured clean landings are 0.43-0.78 m/s
  sink_bad:      2.5      # m/s; overridden per curriculum stage
  roll_ok_deg:   10.0     # deg; wingtip geometry allows ~6 deg before contact
  roll_bad_deg:  35.0     # deg; overridden per curriculum stage
  vtd_ok:        9.0      # m/s; ~1.4x V_stall (6.35 m/s)
  vtd_bad:       13.0     # m/s; ~2.0x V_stall
  alpha_ok_deg:  10.0     # deg; brackets the 12 deg stall angle
  alpha_bad_deg: 14.0     # deg

  # Dense (every step, terminal or not)
  w_path:        0.10     # reward per metre of ACTUAL ground track flown
  w_unreach:     2.0      # one-sided reachability-barrier penalty
  glide_ratio_usable: 8.0 # conservative vs. measured best L/D ~16.7 (12.9 trimmed)
  dt_rl:         0.050    # policy step size (s); multiplied by w_path each step

  # Safety penalties (unchanged from the pre-Phase-4 reward)
  w_stall:      30.0      # stall margin violation: linear penalty
  w_bank:       5.0       # excess bank: linear penalty above soft limit

  # Smoothness regularisation
  w_smooth:     0.01      # L2 penalty on action change (prevents chattering)

  # Truncation backstop (read by GliderEnv.step(), not env/reward.py -- only
  # the env knows about MAX_STEPS)
  w_truncate:   300.0

  # Thresholds
  R_home_m:             20.0    # precision-scoring radius (m); NOT terminal; overridden by curriculum
  stall_buffer_rad:      0.0349 # ~2 deg before stall alpha (rad)
  bank_soft_limit_rad:   0.5236 # 30 deg bank soft limit (rad)

# ---------------------------------------------------------------------------
# PPO hyperparameters (Stable-Baselines3)
# ---------------------------------------------------------------------------
ppo:
  policy:           MlpPolicy
  n_envs:           8               # parallel environments (SubprocVecEnv)
  n_steps:          2048            # rollout steps per env before each update
  batch_size:       256             # minibatch size for gradient updates
  n_epochs:         10              # gradient update passes per rollout
  gae_lambda:       0.95            # GAE lambda for advantage estimation
  gamma:            0.999           # discount factor -- KEEP at 0.999 under Phase 4: episodes
                                     # are now ~900-1200 steps (touchdown-based termination, not
                                     # radius-crossing), ~7x longer than the old ~125-150-step
                                     # episodes. 0.999 matches this longer horizon; an earlier
                                     # review recommendation to drop to 0.99 was calibrated
                                     # against the old short episodes and is now superseded --
                                     # do not apply it.
  ent_coef:         0.005           # entropy bonus (keeps policy exploratory early)
  vf_coef:          0.5             # value function loss coefficient
  max_grad_norm:    0.5             # gradient clipping norm
  learning_rate:    3.0e-4          # Adam learning rate
  clip_range:       0.2             # PPO clipping epsilon
  net_arch:         [128, 128]      # shared MLP hidden layer sizes
  total_timesteps:  20_000_000      # smoke-check / initial-run budget. At ~7x longer episodes
                                     # this buys ~7x fewer episodes than pre-Phase-4 for the same
                                     # step count (~150k -> ~20k); RLGlider_Phase4_Landing_Task_
                                     # Spec.md §6 recommends 40_000_000 for a real full run --
                                     # deliberately not set here, raise explicitly when ready.
  normalize_obs:    true            # use VecNormalize on observations
  normalize_reward: true            # use VecNormalize on rewards
  clip_obs:         10.0            # VecNormalize observation clip bound

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
eval:
  n_episodes:       100             # episodes per evaluation call
  eval_freq:        50_000          # timesteps between EvalCallback evaluations
  deterministic:    true            # use deterministic policy during evaluation
  best_model_path:  checkpoints/best_model
  vecnorm_path:     checkpoints/vecnormalize.pkl

# ---------------------------------------------------------------------------
# Curriculum scheduler
# ---------------------------------------------------------------------------
curriculum:
  advance_threshold: 0.80           # rolling success rate required to advance stage
  rolling_window:    50             # number of recent episodes for rolling rate -- lowered from
                                     # 100 under Phase 4: ~7x fewer episodes per run at a fixed
                                     # timestep budget (see ppo.total_timesteps's note) means a
                                     # 100-episode window makes stage advancement very slow.
                                     # success here is env/reward.py's new definition:
                                     # quality > 0.5 and d_td < R_home_m -- not a radius crossing.

# ---------------------------------------------------------------------------
# Logging and checkpointing
# ---------------------------------------------------------------------------
logging:
  tensorboard_log:  runs/           # TensorBoard log directory
  checkpoint_dir:   checkpoints/    # model checkpoint directory
  checkpoint_freq:  100_000         # timesteps between checkpoints
  verbose:          1               # SB3 verbosity (0=silent, 1=info, 2=debug)

# ---------------------------------------------------------------------------
# Domain randomisation ranges -- REFERENCE ONLY, superseded by curriculum.
# Curriculum integration (mentioned as future work in an earlier revision of
# this comment) has since landed: per-stage aero_scale_range now lives in
# env/curriculum.py STAGES and is the value actually applied via
# JSBSimFDM.apply_domain_rand(). aero_scale_range below happens to equal
# Stage 3's range, but changing it here has no effect.
# ---------------------------------------------------------------------------
domain_rand:
  aero_scale_range:     [0.80,  1.20]  # additive CD0 offset scale (cd0_add = 0.025*(scale-1))
  # cl_mult and ctrl_eff_mult ranges are hardcoded in
  # env/glider_env.py::_sample_domain_rand() (0.9-1.1 and 0.75-1.10 respectively).
  #
  # NOT used with JSBSim (actuator dynamics fixed in aircraft/rlglider/rlglider.xml):
  #   servo_tau_range, servo_rate_scale, servo_max_scale
  # NOT used with JSBSim (mass/inertia fixed in rlglider.xml; pending per-episode XML reload):
  #   mass_range, inertia_scale_range
